name: CI

on:
  # push в main — защита основной ветки; PR — любая ветка (сюда же Dependabot).
  # Ветки без PR не проверяются: иначе один пуш в PR-ветку давал два прогона.
  push:
    branches: ['main']
    tags: ['v*']
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  ci:
    name: typecheck, lint, tests, build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      CI: true
      # Тесты бота используют временные файлы и не требуют реальных секретов.
      WEB_ENABLED: 'false'
    steps:
      - uses: actions/checkout@v7

      # jsdom 31 (тесты панели) требует Node ^22.22 или ^24.15, поэтому CI идёт
      # на актуальном LTS 24.x. Минимальный рантайм бота — 22.13 (node:sqlite).
      - uses: actions/setup-node@v7
        with:
          node-version: '24.x'
          cache: npm
          cache-dependency-path: |
            package-lock.json
            web/package-lock.json

      - name: Install bot dependencies
        run: npm ci

      - name: Install panel dependencies
        run: npm --prefix web ci

      - name: Run checks
        run: npm run ci
