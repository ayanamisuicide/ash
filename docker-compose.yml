services:
  bot:
    build: .
    container_name: probot
    restart: unless-stopped
    init: true
    env_file:
      - .env
    volumes:
      - ./data:/app/data
    healthcheck:
      test: ['CMD', 'node', 'scripts/healthcheck.mjs']
      interval: 30s
      timeout: 5s
      start_period: 20s
      retries: 3
