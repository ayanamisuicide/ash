version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    commit-message:
      prefix: deps
    labels:
      - dependencies
    # Один PR на все minor/patch: CI проверяет совместимость пакетов вместе.
    groups:
      bot-minor-patch:
        patterns:
          - '*'
        update-types:
          - minor
          - patch
    # Мажоры обновляются вручную вместе с миграцией: иначе поток красных PR
    # (vite 8, plugin-react 6, framer-motion 14, ...) перекрывает сигнал CI.
    ignore:
      - dependency-name: '*'
        update-types:
          - version-update:semver-major

  - package-ecosystem: npm
    directory: /web
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    commit-message:
      prefix: deps(web)
    labels:
      - dependencies
    groups:
      panel-minor-patch:
        patterns:
          - '*'
        update-types:
          - minor
          - patch
    ignore:
      - dependency-name: '*'
        update-types:
          - version-update:semver-major

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: deps(actions)
    labels:
      - dependencies
